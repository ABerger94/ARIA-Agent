name: ARIA v1 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint deps
        run: pip install ruff pytest
      - name: Ruff — no unused imports
        run: python -m ruff check aria/ --select F401 --exclude '__init__.py'
      - name: Test suites (pytest)
        run: |
          python -m pytest tests/test_ops.py tests/test_headless.py tests/test_providers.py -q
          python -m pytest tests/test_ultimate_a.py tests/test_ultimate_b.py tests/test_ultimate_c.py tests/test_ultimate_d.py tests/test_ultimate_e.py -q
