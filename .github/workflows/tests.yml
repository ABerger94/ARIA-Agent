name: ARIA v1 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint deps
        run: pip install ruff
      - name: Ruff — no unused imports
        run: python -m ruff check aria/ --select F401 --exclude '__init__.py'
      - name: Test suites
        run: |
          python tests/test_ops.py
          python tests/test_headless.py
          python tests/test_providers.py
          python tests/test_ultimate_a.py
          python tests/test_ultimate_b.py
          python tests/test_ultimate_c.py
          python tests/test_ultimate_d.py
          python tests/test_ultimate_e.py
