name: ARIA acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  isolated-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native Qt libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libxtst6 libxkbfile1 libxcomposite1 libxdamage1 libxrandr2 libnss3 libasound2t64 libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-shm0 libxcb-render0 libxcb-xfixes0 libxrender1 libxi6 libxext6 libxshmfence1 libgbm1 libdrm2 libfontconfig1 libx11-xcb1 libxkbcommon-x11-0
      - name: Test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Lint and syntax
        run: |
          python -m ruff check aria/ --select F401,F811,F821,F822,F823 --exclude '__init__.py'
          python -m compileall -q aria installer scripts
      - name: Discover all suites (one process per file)
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: python scripts/test_suites.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: test-results/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser runtime
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libxtst6 libxkbfile1 libxcomposite1 libxdamage1 libxrandr2 libnss3 libasound2t64 libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-shm0 libxcb-render0 libxcb-xfixes0 libxrender1 libxi6 libxext6 libxshmfence1 libgbm1 libdrm2 libfontconfig1 libx11-xcb1 libxkbcommon-x11-0 xvfb xauth
      - run: python -m pip install -r requirements-test.txt
      - name: Real browser acceptance
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: QT_QPA_PLATFORM=xcb xvfb-run -a python -m pytest tests/test_phone_browser.py -q -s

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build-lock.txt
      - name: Install the locked product and build tools
        run: |
          python -m pip install --require-hashes -r requirements-build-lock.txt
          python -m pip check
          python -m pip install pytest==8.4.2
      - name: Native Windows import, UI, COM and install acceptance
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_windows_acceptance.py -q
      - name: Build the distributable
        run: python installer/build_installer.py
      - name: Boot the frozen application in diagnostic mode
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/ARIA/ARIA.exe --diagnostics
      - name: Compile the per-user installer
        shell: pwsh
        run: |
          $ariaIscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $ariaIscc) { $ariaIscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $ariaIscc)) { choco install innosetup --yes --no-progress; $ariaIscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $ariaIscc installer/ARIA-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ARIA-Windows
          path: |
            dist/ARIA/
            installer/Output/*.exe
